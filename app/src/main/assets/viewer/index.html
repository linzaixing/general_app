<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>URDF 视窗</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0F172A;
      --panel: rgba(15, 23, 42, .88);
      --panel-soft: rgba(15, 23, 42, .72);
      --line: rgba(255, 255, 255, .08);
      --line2: rgba(255, 255, 255, .16);
      --fg: #FFFFFF;
      --fg2: #CBD5E1;
      --fg3: #94A3B8;
      --acc: #0891B2;
      --accBg: rgba(8, 145, 178, .16);
      --accLine: rgba(8, 145, 178, .48);
      --ok: #10B981;
      --warn: #F59E0B;
      --bad: #EF4444;
      --shadow: 0 16px 48px rgba(0, 0, 0, .34);
      --blur: blur(18px) saturate(130%);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; background: var(--bg);
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { touch-action: none; }

    /* 上下渐隐：让浮层控件压在 3D 画面上依然清晰 */
    .scrimTop {
      position: fixed; left: 0; right: 0; top: 0; height: 132px; z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(2, 8, 20, .92) 0%, rgba(2, 8, 20, .46) 58%, transparent 100%);
    }
    .scrimBot {
      position: fixed; left: 0; right: 0; bottom: 0; height: 220px; z-index: 1;
      pointer-events: none;
      background: linear-gradient(0deg, rgba(2, 8, 20, .94) 0%, rgba(2, 8, 20, .55) 52%, transparent 100%);
    }

    /* 顶栏：品牌 + 数据状态 */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 64px; z-index: 3;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand i {
      width: 8px; height: 8px; border-radius: 50%; background: var(--acc);
      box-shadow: 0 0 14px rgba(8, 145, 178, .52); display: block;
    }
    .brand b {
      font-size: 12px; font-weight: 700; letter-spacing: .18em; color: var(--fg);
    }
    .statusPill {
      display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 13px;
      border-radius: 999px; background: var(--panel); border: 1px solid var(--line2);
      backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
      box-shadow: var(--shadow); color: var(--fg2);
      font-size: 11px; font-weight: 600; letter-spacing: .04em;
      font-variant-numeric: tabular-nums;
      transition: color .2s ease-out, border-color .2s ease-out;
    }
    .statusPill .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--fg3);
      transition: background-color .2s ease-out;
    }
    .statusPill[data-state="live"] { color: var(--fg); border-color: rgba(16, 185, 129, .38); }
    .statusPill[data-state="live"] .dot { background: var(--ok); animation: pulse 1.6s ease-in-out infinite; }
    .statusPill[data-state="wait"] .dot,
    .statusPill[data-state="stale"] .dot { background: var(--warn); }
    .statusPill[data-state="wait"],
    .statusPill[data-state="stale"] { color: #FCD34D; border-color: rgba(245, 158, 11, .38); }
    .statusPill[data-state="err"] { color: #FCA5A5; border-color: rgba(239, 68, 68, .38); }
    .statusPill[data-state="err"] .dot { background: var(--bad); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

    /* 底部数据舱：关节角 + 提示 + 告警 */
    .deck {
      position: fixed; left: 14px; right: 14px; bottom: 14px; z-index: 3;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .warnLine {
      display: none; align-items: flex-start; gap: 8px; min-height: 30px;
      padding: 8px 12px; border-radius: 13px;
      background: rgba(245, 158, 11, .10); border: 1px solid rgba(245, 158, 11, .34);
      color: #FCD34D; font-size: 11px; line-height: 1.55;
    }
    .warnLine::before {
      content: ''; width: 7px; height: 7px; border-radius: 50%;
      background: var(--warn); flex: 0 0 7px; margin-top: 4px;
    }
    .warnLine.on { display: flex; }
    .joints {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px;
      padding: 7px; border-radius: 18px;
      background: var(--panel); border: 1px solid var(--line2);
      backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
      box-shadow: var(--shadow);
    }
    .joint {
      min-width: 0; min-height: 56px; border-radius: 12px;
      background: var(--panel-soft); border: 1px solid transparent;
      display: flex; flex-direction: column; justify-content: center; gap: 4px;
      padding: 8px 6px; text-align: center;
      transition: border-color .16s ease-out;
    }
    .joint .tag {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      font-size: 10px; font-weight: 600; letter-spacing: .08em; color: var(--fg3);
    }
    .joint .tag i { width: 6px; height: 6px; border-radius: 50%; display: block; }
    .joint .val {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px; font-weight: 600; color: var(--fg);
      font-variant-numeric: tabular-nums; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .joint.clamp { border-color: rgba(245, 158, 11, .44); }
    .joint.clamp .tag { color: #FCD34D; }
    .hintRow {
      display: flex; justify-content: center; min-height: 26px;
    }
    #hint {
      display: flex; align-items: center; height: 26px; padding: 0 11px;
      border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
      color: var(--fg3); font-size: 10.5px; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; max-width: 100%;
    }
    /* 数据异常（未收到 / 已停止）时转琥珀色，避免和正常提示混成一条灰字 */
    #hint.warn { color: #FCD34D; border-color: rgba(245, 158, 11, .30); }

    @media (max-width: 380px) {
      .joint .val { font-size: 12px; }
      .brand b { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .statusPill .dot { animation: none; }
      .statusPill, .statusPill .dot, .joint { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="scrimTop"></div>
  <div class="scrimBot"></div>

  <header class="topbar">
    <div class="brand"><i></i><b>ARM CONSOLE</b></div>
    <div class="statusPill" id="statusPill" role="status" aria-live="polite">
      <span class="dot"></span><span id="statusText">加载中</span>
    </div>
  </header>

  <div class="deck">
    <div class="warnLine" id="warnLine"></div>
    <div class="joints" id="joints" aria-label="关节角读数"></div>
    <div class="hintRow">
      <div id="hint">单指拖动旋转 · 双指缩放 · 双击空白处复位视角</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from '../three/three.module.js';
    import { STLLoader } from '../three/STLLoader.js';
    import { OrbitControls } from '../three/OrbitControls.js';

    // Kotlin 侧读这个字符串判断是否加载成功（WebView 里 console 拿不到）。
    window.viewerStatus = 'loading';

    // URDF 的 rpy 是「固定轴 XYZ」（= R = Rz*Ry*Rx），用四元数显式相乘，避免依赖
    // three.js Euler order 的语义歧义。
    const AXIS_X = new THREE.Vector3(1, 0, 0);
    const AXIS_Y = new THREE.Vector3(0, 1, 0);
    const AXIS_Z = new THREE.Vector3(0, 0, 1);

    function rpyToQuaternion(roll, pitch, yaw, target) {
      target.identity();
      target.setFromAxisAngle(AXIS_X, roll);
      const q = new THREE.Quaternion();
      q.setFromAxisAngle(AXIS_Y, pitch);
      target.premultiply(q);
      q.setFromAxisAngle(AXIS_Z, yaw);
      target.premultiply(q);
      return target;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0F172A);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('app').appendChild(renderer.domElement);

    // URDF / ROS 约定是 Z 轴朝上。
    const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 20);
    camera.up.set(0, 0, 1);

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const key = new THREE.DirectionalLight(0xffffff, 1.6);
    key.position.set(0.8, -0.9, 1.4);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 0.8);
    fill.position.set(-1.0, 0.8, 0.4);
    scene.add(fill);

    // 每个 link（= 每个关节的机体）一种颜色，一眼能看出是哪一节在动。
    // 读数卡上的色点用同一组颜色，UI 与 3D 一一对应。
    const LINK_COLORS = {
      base_link: 0x5c6b7a,
      first_Link: 0x38BDF8,
      second_Link: 0xF59E0B,
      third_Link: 0x34D399,
      fourth_Link: 0xA78BFA,
      fifth_Link: 0xF87171,
    };

    // 地面网格：URDF/ROS 约定 Z 轴朝上，而 GridHelper 默认铺在 XZ 平面，
    // 所以绕 X 转 90° 铺到 XY 平面，z=0 正好是底座底面。
    const grid = new THREE.GridHelper(1.2, 24, 0x334D6B, 0x1B2940);
    grid.rotation.x = Math.PI / 2;
    scene.add(grid);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.12;
    controls.target.set(0, -0.1, 0.2);

    // 每个 revolute 关节一个节点，顺序 = URDF 里出现的顺序 = 电机 ID1~ID5。
    // `lo/hi` 是该关节的**机械限位**（URDF <limit>）：CAD 里两个零件接触的位置。
    const jointNodes = [];
    let pendingQ = null;
    let ready = false;
    let clampedJoints = [];

    // 最后一次**拿到可用关节角**的时刻（0 = 从未拿到），单位 ms。
    // ⚠️ 这是「3D 看着正常、其实是假象」的唯一告警口：页面在收到 setJoints 之前，
    //    所有关节都停在初始姿态（全 0），渲染出来的正是 **URDF 的软件零位**；
    //    真机停在别的位形时，看起来就像「仿真在软件零位、真机在初始零位」。
    //    2026-10-09 实机就因此误判过，所以必须把状态直接写在画面上。
    let lastQAt = 0;
    // App 侧是 10Hz 推、且只在角度变化时才推，静止时本来就不推 —— 阈值不能太小。
    const STALE_MS = 2000;
    let lastHintAt = 0;
    let hintText = '';
    let hintWarn = false;

    const hintEl = document.getElementById('hint');
    const statusPill = document.getElementById('statusPill');
    const statusText = document.getElementById('statusText');
    const warnLine = document.getElementById('warnLine');
    const jointsEl = document.getElementById('joints');
    const HINT_BASE = '单指拖动旋转 · 双指缩放 · 双击空白处复位视角';

    // ------- 底部关节数据舱（读数卡与 3D 颜色一一对应） -------
    let jointChips = [];
    const displayQ = [];

    function chipColorCss(linkName) {
      const c = LINK_COLORS[linkName];
      if (c === undefined) return '#94A3B8';
      return '#' + c.toString(16).padStart(6, '0');
    }

    function buildJointChips() {
      jointsEl.innerHTML = '';
      jointChips = [];
      jointNodes.forEach((j, i) => {
        const chip = document.createElement('div');
        chip.className = 'joint';
        chip.innerHTML = '<span class="tag"><i></i>J' + (i + 1) + '</span>'
          + '<span class="val">—</span>';
        chip.querySelector('.tag i').style.background = chipColorCss(j.link);
        jointsEl.appendChild(chip);
        jointChips.push(chip);
        displayQ[i] = null;
      });
    }

    function fmtDeg(rad) {
      const deg = rad * 180 / Math.PI;
      return deg.toFixed(1) + '°';
    }

    function updateChip(i, applied) {
      const chip = jointChips[i];
      if (!chip) return;
      displayQ[i] = applied;
      chip.querySelector('.val').textContent = applied === null ? '—' : fmtDeg(applied);
    }

    function dataStatus() {
      if (!ready) return '模型加载中…';
      if (!lastQAt) {
        return '未收到关节数据 —— 3D 停在 URDF 初始姿态，不代表真机'
          + '（检查 App 是否已连上服务端；服务端缺 sign/m0 映射时也不会下发关节角）';
      }
      const ageMs = performance.now() - lastQAt;
      if (ageMs > STALE_MS) {
        return '关节数据已停止 ' + (ageMs / 1000).toFixed(0) + 's —— 显示的不是真机姿态';
      }
      return '';
    }

    function pillState() {
      if (!ready) return ['load', '加载中'];
      if (!lastQAt) return ['wait', '等待数据'];
      if (performance.now() - lastQAt > STALE_MS) return ['stale', '数据中断'];
      return ['live', '实时'];
    }

    function updateHint() {
      const parts = [HINT_BASE];
      if (clampedJoints.length) parts.push('已达机械限位：J' + clampedJoints.join(' J'));
      const st = dataStatus();
      if (st) parts.push(st);
      const text = parts.join('　|　');
      if (text !== hintText) {
        hintText = text;
        hintEl.textContent = text;
      }
      if (!!st !== hintWarn) {
        hintWarn = !!st;
        hintEl.classList.toggle('warn', hintWarn);
      }
    }

    // 状态胶囊 + 告警条与 hint 同源：全部由 dataStatus()/限位状态派生，
    // 任何一处变化都会在 4Hz 复核里反映出来。
    function updateUI() {
      const [state, label] = pillState();
      if (statusPill.dataset.state !== state) statusPill.dataset.state = state;
      if (statusText.textContent !== label) statusText.textContent = label;

      const warns = [];
      if (clampedJoints.length) warns.push('已达机械限位：J' + clampedJoints.join(' J') + '（显示值停在限位处）');
      const st = ready ? dataStatus() : '';
      if (st) warns.push(st);
      const warnText = warns.join('；');
      if (warnLine.textContent !== warnText) warnLine.textContent = warnText;
      warnLine.classList.toggle('on', !!warnText);

      jointChips.forEach((chip, i) => {
        chip.classList.toggle('clamp', clampedJoints.includes(i + 1));
      });
    }

    function wrapPi(v) {
      return v - 2 * Math.PI * Math.round(v / (2 * Math.PI));
    }

    // ⚠️ 必须按机械限位钳制，不能原样套用服务端给的 q。
    // 电机读数换算出的关节角（q = sign×(pos−m0)）在实机上会**略微越出** URDF 限位
    // ——最典型的是失能后臂靠自重停在机械挡块上时（实测 ID2 超上限 0.23 rad、
    // ID3 超下限 0.31 rad，根源是 m0 来自重力前馈辨识、不是运动学零位标定）。
    // 原样套用会把上臂/腕部转进底座（ID1 电机那一段）里，就是看到的「穿模」。
    // 钳制后模型**停在接触位置**，等价于真机「碰到即顶住不动」的硬限位行为。
    function applyAngles(arr) {
      clampedJoints = [];
      for (let i = 0; i < jointNodes.length; i++) {
        const v = arr[i];
        const usable = typeof v === 'number' && isFinite(v);
        if (!usable) { updateChip(i, null); continue; }
        const j = jointNodes[i];
        const w = wrapPi(v);
        let a = w;
        if (j.lo !== null && w < j.lo) a = j.lo;
        else if (j.hi !== null && w > j.hi) a = j.hi;
        if (a !== w) clampedJoints.push(i + 1);
        j.node.quaternion.setFromAxisAngle(j.axis, a);
        updateChip(i, a);
      }
      updateHint();
      updateUI();
    }

    // Kotlin 侧 10Hz 推关节角（单位 rad，URDF 关节角 q = sign×(pos−m0)）。
    window.setJoints = function (arr) {
      if (!Array.isArray(arr)) return;
      pendingQ = arr;
      // 只有真带回至少一个可用角度才算「有数据」—— 服务端缺 sign/m0 映射时
      // 会把 q 发成 null，那一帧必须一并判掉，否则会误报成「数据正常」。
      if (arr.some((v) => typeof v === 'number' && isFinite(v))) {
        lastQAt = performance.now();
      }
      if (ready) applyAngles(arr);
    };

    // 只读调试/测试接口：暴露每个关节的机械限位，便于自动化验证钳制行为。
    window.getJointInfo = function () {
      return jointNodes.map((j) => ({ lo: j.lo, hi: j.hi, link: j.link }));
    };

    function parseVec(str, fallback) {
      if (!str) return fallback.slice();
      const parts = str.trim().split(/\s+/).map(Number);
      if (parts.length !== 3 || parts.some((v) => !isFinite(v))) return fallback.slice();
      return parts;
    }

    // <limit lower="..." upper="..."> 缺省或非法时返回 null（= 不钳制该侧）。
    function parseLimit(el, attr) {
      const v = el && el.getAttribute(attr);
      if (v === null || v === undefined || v === '') return null;
      const n = Number(v);
      return isFinite(n) ? n : null;
    }

    // package://<pkg>/meshes/xxx.STL  ->  ../meshes/xxx.STL（assets 里已拍平成一个目录）
    function meshUrl(filename) {
      const base = filename.split('/').pop();
      return '../meshes/' + base;
    }

    function parseUrdf(text) {
      const doc = new DOMParser().parseFromString(text, 'application/xml');
      if (doc.querySelector('parsererror')) throw new Error('URDF XML 解析失败');

      const links = {};
      doc.querySelectorAll('robot > link').forEach((el) => { links[el.getAttribute('name')] = el; });

      const joints = [];
      doc.querySelectorAll('robot > joint').forEach((el) => {
        const origin = el.querySelector(':scope > origin');
        const axisEl = el.querySelector(':scope > axis');
        const limitEl = el.querySelector(':scope > limit');
        joints.push({
          name: el.getAttribute('name'),
          type: el.getAttribute('type'),
          parent: el.querySelector(':scope > parent').getAttribute('link'),
          child: el.querySelector(':scope > child').getAttribute('link'),
          xyz: parseVec(origin && origin.getAttribute('xyz'), [0, 0, 0]),
          rpy: parseVec(origin && origin.getAttribute('rpy'), [0, 0, 0]),
          axis: parseVec(axisEl && axisEl.getAttribute('xyz'), [1, 0, 0]),
          lo: parseLimit(limitEl, 'lower'),
          hi: parseLimit(limitEl, 'upper'),
        });
      });

      const childLinks = new Set(joints.map((j) => j.child));
      const rootName = Object.keys(links).find((n) => !childLinks.has(n));
      if (!rootName) throw new Error('URDF 找不到根 link');
      return { links, joints, rootName };
    }

    const loader = new STLLoader();
    const meshCache = new Map();

    function loadMesh(url) {
      if (!meshCache.has(url)) {
        meshCache.set(url, new Promise((resolve) => {
          loader.load(url, resolve, undefined, (err) => {
            console.warn('mesh 加载失败', url, err);
            resolve(null);
          });
        }));
      }
      return meshCache.get(url);
    }

    async function buildVisuals(linkEl, linkGroup) {
      const visuals = linkEl.querySelectorAll(':scope > visual');
      const linkName = linkEl.getAttribute('name');
      for (const visual of visuals) {
        const meshEl = visual.querySelector('geometry > mesh');
        if (!meshEl) continue;
        const geometry = await loadMesh(meshUrl(meshEl.getAttribute('filename')));
        if (!geometry) continue;
        geometry.computeVertexNormals();

        // 颜色按 link 给（同一 link 的多个 visual 同色），不再用 URDF 里那套
        // 大片重复的青白色 —— 一节能和另一节区分开才好看出是哪一节在动。
        const colorEl = visual.querySelector('material > color');
        const rgba = parseVec(colorEl && colorEl.getAttribute('rgba'), [0.72, 0.74, 0.78]);
        const tint = LINK_COLORS[linkName];
        const material = new THREE.MeshStandardMaterial({
          color: tint === undefined ? new THREE.Color(rgba[0], rgba[1], rgba[2]) : tint,
          metalness: 0.35,
          roughness: 0.55,
        });

        const mesh = new THREE.Mesh(geometry, material);
        // visual 自己的 origin：本项目里末端两个 link 不是 0，必须照搬。
        const vorigin = visual.querySelector(':scope > origin');
        mesh.position.fromArray(parseVec(vorigin && vorigin.getAttribute('xyz'), [0, 0, 0]));
        const vrpy = parseVec(vorigin && vorigin.getAttribute('rpy'), [0, 0, 0]);
        rpyToQuaternion(vrpy[0], vrpy[1], vrpy[2], mesh.quaternion);
        linkGroup.add(mesh);
      }
    }

    async function buildLink(name, parentObj, ctx) {
      const linkGroup = new THREE.Group();
      linkGroup.name = name;
      parentObj.add(linkGroup);

      const linkEl = ctx.links[name];
      if (linkEl) await buildVisuals(linkEl, linkGroup);

      for (const joint of ctx.joints.filter((j) => j.parent === name)) {
        const originGroup = new THREE.Group();
        originGroup.position.fromArray(joint.xyz);
        rpyToQuaternion(joint.rpy[0], joint.rpy[1], joint.rpy[2], originGroup.quaternion);
        linkGroup.add(originGroup);

        const axisGroup = new THREE.Group();
        originGroup.add(axisGroup);
        if (joint.type === 'revolute' || joint.type === 'continuous') {
          jointNodes.push({
            node: axisGroup,
            axis: new THREE.Vector3().fromArray(joint.axis).normalize(),
            lo: joint.lo,
            hi: joint.hi,
            link: joint.child,
          });
        }
        await buildLink(joint.child, axisGroup, ctx);
      }
    }

    function fitCamera(obj) {
      const box = new THREE.Box3().setFromObject(obj);
      if (box.isEmpty()) return;
      const sphere = box.getBoundingSphere(new THREE.Sphere());
      const dist = Math.max(sphere.radius * 2.3, 0.4);
      const dir = new THREE.Vector3(0.55, -0.75, 0.5).normalize();
      camera.position.copy(sphere.center).addScaledVector(dir, dist);
      camera.near = Math.max(dist / 100, 0.005);
      camera.far = dist * 20;
      camera.updateProjectionMatrix();
      controls.target.copy(sphere.center);
      controls.update();
      // 「原始视角」= 首帧自动取景的结果，双击时回到这里。
      camHome = { pos: camera.position.clone(), target: controls.target.clone() };
    }

    // 双击（含触屏双击）空白处：平滑回到 camHome。
    let camHome = null;
    let camAnim = null;
    const RESET_MS = 420;

    function resetView() {
      if (!camHome) return;
      camAnim = {
        t0: performance.now(),
        pos: camera.position.clone(),
        target: controls.target.clone(),
      };
    }

    // Android WebView 里 touch 序列不一定派发 dblclick，统一用「两次快速点按」判定；
    // 鼠标双击同样是两次快速 pointerdown/up，走同一条路径。
    let lastTap = { t: 0, x: 0, y: 0 };
    renderer.domElement.addEventListener('pointerup', (e) => {
      const now = performance.now();
      const near = Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 24;
      if (now - lastTap.t < 320 && near) {
        lastTap.t = 0;
        resetView();
        return;
      }
      lastTap = { t: now, x: e.clientX, y: e.clientY };
    });

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      // 必须让 three.js 同时更新 canvas 的 CSS 尺寸（第三个参数保持 true）。
      // setPixelRatio(2) 后 backing store 是 2 倍，若只改 backing 不改 style，
      // canvas 会按 2 倍尺寸溢出 WebView，画面只剩左上角 1/4（看着像特写）。
      renderer.setSize(w, h);
      camera.aspect = w / Math.max(h, 1);
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);

    function animate() {
      requestAnimationFrame(animate);
      if (camAnim && camHome) {
        const k = Math.min(1, (performance.now() - camAnim.t0) / RESET_MS);
        const e = k * k * (3 - 2 * k);   // smoothstep，起步和收尾都不生硬
        camera.position.lerpVectors(camAnim.pos, camHome.pos, e);
        controls.target.lerpVectors(camAnim.target, camHome.target, e);
        if (k >= 1) camAnim = null;
      }
      controls.update();
      renderer.render(scene, camera);
      // 4Hz 复核一次提示文案：模型加载完 / 数据断了都要能自己反映出来。
      // 不能只靠 setJoints 触发 —— 否则「一直没收到数据」这条永远不更新。
      if (performance.now() - lastHintAt > 250) {
        lastHintAt = performance.now();
        updateHint();
        updateUI();
      }
    }

    (async () => {
      try {
        const res = await fetch('../urdf/URDF_armv001_a3tip.urdf');
        if (!res.ok) throw new Error('URDF HTTP ' + res.status);
        const ctx = parseUrdf(await res.text());
        const root = new THREE.Group();
        scene.add(root);
        await buildLink(ctx.rootName, root, ctx);
        fitCamera(root);
        ready = true;
        buildJointChips();
        if (pendingQ) applyAngles(pendingQ);
        window.viewerStatus = 'ready:joints=' + jointNodes.length;
        updateUI();
      } catch (e) {
        window.viewerStatus = 'error:' + (e && e.message ? e.message : e);
        statusPill.dataset.state = 'err';
        statusText.textContent = '加载失败';
        warnLine.textContent = '模型加载失败：' + (e && e.message ? e.message : e);
        warnLine.classList.add('on');
        console.error('URDF 视窗初始化失败', e);
      }
    })();

    resize();
    animate();
  </script>
</body>
</html>
