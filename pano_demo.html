<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全景查看器</title>
<style>
  :root{
    --bg:#0b0b0c; --panel:rgba(20,20,23,.60); --card:rgba(20,20,23,.95);
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.20);
    --fg:#fefefe; --fg2:rgba(202,202,202,.74); --fg3:rgba(148,148,152,.62);
    --acc:#7db4ff; --accBg:rgba(125,180,255,.15); --accLine:rgba(125,180,255,.38);
    --rec:#ff5a5f;
    --blur:blur(22px) saturate(150%);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden;
    font-family:"Inter", -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing:antialiased; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block;
    touch-action:none; cursor:grab; z-index:0; }
  canvas.dragging { cursor:grabbing; }

  /* 上下渐隐，保证控件压在照片上依然清晰 */
  .scrimTop { position:fixed; left:0; right:0; top:0; height:150px; z-index:1; pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,.66) 0%, rgba(0,0,0,.26) 55%, rgba(0,0,0,0) 100%); }
  .scrimBot { position:fixed; left:0; right:0; bottom:0; height:290px; z-index:1; pointer-events:none;
    background:linear-gradient(0deg, rgba(0,0,0,.86) 0%, rgba(0,0,0,.50) 34%, rgba(0,0,0,0) 100%); }

  /* 顶栏 */
  .hdr { position:fixed; top:0; left:0; right:0; height:62px; z-index:3;
    display:flex; align-items:center; justify-content:space-between; padding:0 18px; }
  .brand { display:flex; align-items:center; gap:9px; }
  .brand i { width:7px; height:7px; border-radius:50%; background:var(--acc);
    box-shadow:0 0 12px var(--acc); display:block; }
  .brand b { font-size:11px; font-weight:600; letter-spacing:.22em; color:rgba(255,255,255,.82); }
  .ic { width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
    display:grid; place-items:center; color:var(--fg2); padding:0; }
  .ic svg { width:19px; height:19px; }
  .ic.on { color:var(--acc); border-color:var(--accLine); background:var(--accBg); }

  /* 投影模式切换 */
  .bar { position:fixed; top:74px; left:18px; right:18px; z-index:3;
    display:flex; gap:2px; padding:3px; border-radius:999px;
    background:var(--panel); border:1px solid var(--line);
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); }
  .bar button { flex:1; height:34px; border:0; border-radius:999px; padding:0;
    background:transparent; color:var(--fg3); font-size:12px; font-weight:500;
    font-family:inherit; transition:background .15s, color .15s; }
  .bar button.active { background:var(--accBg); color:var(--acc);
    box-shadow:inset 0 0 0 1px var(--accLine); }

  /* 录屏指示 */
  .rec { position:fixed; top:124px; left:50%; transform:translateX(-50%); z-index:3;
    display:none; align-items:center; gap:7px; height:28px; padding:0 13px;
    border-radius:999px; background:rgba(255,90,95,.17); border:1px solid rgba(255,90,95,.45);
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
    color:#ffd9da; font-size:11px; letter-spacing:.10em; font-variant-numeric:tabular-nums; }
  .rec.on { display:flex; }
  .rec i { width:6px; height:6px; border-radius:50%; background:var(--rec); display:block;
    animation:blink 1.2s ease-in-out infinite; }

  /* 寻宝 HUD */
  .hud { position:fixed; top:124px; left:18px; z-index:3; display:none;
    padding:11px 13px; border-radius:14px; background:var(--panel); border:1px solid var(--line);
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
    color:var(--fg2); font-size:11px; line-height:1.75; font-variant-numeric:tabular-nums; }
  .hud.on { display:block; }
  .hud b { color:var(--fg); font-weight:600; }

  /* 底部 Dock */
  .dock { position:fixed; left:12px; right:12px; bottom:16px; z-index:4;
    display:flex; flex-direction:column; gap:8px; }
  .chips { display:flex; gap:4px; padding:6px; border-radius:16px;
    background:var(--panel); border:1px solid var(--line);
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); }
  .chip { flex:1; height:40px; border:0; border-radius:11px; background:transparent;
    color:var(--fg3); display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:4px; font-family:inherit; font-size:9.5px; line-height:1;
    white-space:nowrap; padding:0; transition:background .15s, color .15s; }
  .chip svg { width:17px; height:17px; }
  .chip.on { color:var(--acc); background:var(--accBg); box-shadow:inset 0 0 0 1px var(--accLine); }

  .actions { display:flex; align-items:center; gap:10px; }
  .side { width:60px; height:60px; border-radius:16px; border:1px solid var(--line);
    background:var(--panel); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
    color:var(--fg2); display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:4px; font-family:inherit; font-size:9.5px; line-height:1;
    padding:0; transition:background .15s, color .15s; }
  .side svg { width:20px; height:20px; }
  .side.on { color:var(--acc); border-color:var(--accLine); background:var(--accBg); }
  .shutter { flex:1; height:74px; border:0; background:transparent; padding:0;
    display:grid; place-items:center; }
  .shutter i { width:74px; height:74px; border-radius:50%; display:grid; place-items:center;
    background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.22);
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); transition:.15s; }
  .shutter i::after { content:''; width:56px; height:56px; border-radius:50%; display:block;
    background:#fefefe; box-shadow:0 4px 16px rgba(0,0,0,.35);
    background-image:radial-gradient(circle, var(--rec) 0 11px, transparent 11.5px);
    background-repeat:no-repeat; background-position:center; transition:.15s; }
  .shutter.on i { background:rgba(255,90,95,.18); border-color:rgba(255,90,95,.55); }
  .shutter.on i::after { background:#fefefe;
    background-image:radial-gradient(circle, var(--rec) 0 0); box-shadow:none; }

  /* 状态条 */
  .statusRow { position:fixed; left:18px; right:18px; bottom:158px; z-index:3;
    display:flex; align-items:center; justify-content:space-between; pointer-events:none; }
  .fps { display:none; align-items:center; gap:6px; height:24px; padding:0 10px;
    border-radius:999px; background:rgba(0,0,0,.38); border:1px solid var(--line);
    color:var(--acc); font-size:10px; letter-spacing:.04em; font-variant-numeric:tabular-nums; }
  .fps.on { display:flex; }
  .hint { height:24px; display:flex; align-items:center; padding:0 11px; border-radius:999px;
    background:rgba(0,0,0,.38); border:1px solid var(--line); color:var(--fg3);
    font-size:10.5px; white-space:nowrap; }

  .toast { position:fixed; left:50%; bottom:196px; transform:translate(-50%,8px); z-index:5;
    padding:9px 14px; border-radius:999px; background:rgba(18,18,20,.94);
    border:1px solid var(--line2); color:var(--fg); font-size:12px;
    box-shadow:0 12px 34px rgba(0,0,0,.55); opacity:0; pointer-events:none;
    white-space:nowrap; transition:opacity .2s, transform .2s; }
  .toast.on { opacity:1; transform:translate(-50%,0); }

  .layer { position:fixed; inset:0; z-index:2; pointer-events:none; }

  .spot { position:absolute; transform:translate(-50%,-50%); pointer-events:auto;
    cursor:pointer; display:flex; align-items:center; gap:6px; }
  .spot i { width:13px; height:13px; border-radius:50%; background:var(--acc); display:block;
    box-shadow:0 0 0 3px rgba(125,180,255,.22), 0 0 14px rgba(125,180,255,.85); }
  .spot b { font-weight:500; font-size:11px; color:var(--fg); background:rgba(18,18,20,.9);
    border:1px solid var(--line); padding:4px 9px; border-radius:999px; white-space:nowrap;
    opacity:0; transition:opacity .15s; }
  .spot:hover b { opacity:1; }
  .spot.hide { display:none; }

  .target { position:absolute; transform:translate(-50%,-50%); pointer-events:none;
    width:44px; height:44px; border-radius:50%;
    border:2px solid var(--acc); box-shadow:0 0 18px rgba(125,180,255,.8);
    animation:pulse 1.7s ease-in-out infinite; }
  .target::after { content:'★'; position:absolute; inset:0; display:grid; place-items:center;
    color:var(--acc); font-size:17px; }
  .target.hide { display:none; }
  @keyframes pulse { 0%,100% { transform:translate(-50%,-50%) scale(.9); opacity:.85; }
    50% { transform:translate(-50%,-50%) scale(1.12); opacity:.35; } }
  @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:.22 } }

  .mag { position:fixed; right:18px; bottom:190px; width:200px; height:200px;
    border-radius:16px; border:1px solid var(--line2); display:none;
    z-index:2; pointer-events:none; box-shadow:0 8px 30px rgba(0,0,0,.6); }
  .mag.on { display:block; }

  .compare { position:fixed; inset:0; z-index:1; display:none; --split:50%; }
  .compare.on { display:block; }
  .compare img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    clip-path:inset(0 calc(100% - var(--split)) 0 0); }
  .compare .handle { position:absolute; top:0; bottom:0; left:var(--split); width:2px;
    background:rgba(255,255,255,.9); cursor:ew-resize; }
  .compare .handle::after { content:'原图 | 拼接'; position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%); font-size:12px; color:#0b0b0c; background:var(--fg);
    padding:5px 11px; border-radius:999px; white-space:nowrap; }

  /* 弹层（遮罩 + 卡片） */
  .modal { position:fixed; inset:0; z-index:7; display:none; place-items:center;
    background:rgba(5,5,7,.44);
    backdrop-filter:blur(12px) saturate(120%); -webkit-backdrop-filter:blur(12px) saturate(120%); }
  .modal.on { display:grid; }
  .card { width:calc(100% - 44px); max-width:334px; padding:20px; border-radius:20px;
    background:var(--card); border:1px solid var(--line2); box-shadow:0 30px 76px rgba(0,0,0,.72); }
  .card h3 { margin:0 0 4px; font-size:16px; font-weight:600; color:var(--fg); letter-spacing:-.01em; }
  .card p { margin:0; font-size:11px; color:var(--fg3); line-height:1.65; }
  .card .row { display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 0; border-top:1px solid var(--line); }
  .card .row:first-of-type { margin-top:14px; }
  .card .row span { font-size:12px; color:var(--fg2); white-space:nowrap; }
  .seg { display:flex; gap:3px; padding:3px; border-radius:11px;
    background:rgba(255,255,255,.05); border:1px solid var(--line); }
  .seg button { height:28px; padding:0 10px; border:0; border-radius:9px; background:transparent;
    color:var(--fg3); font-size:11px; font-family:inherit; transition:.15s; }
  .seg button.on { background:var(--accBg); color:var(--acc); box-shadow:inset 0 0 0 1px var(--accLine); }
  .foot { display:flex; gap:9px; margin-top:20px; }
  .btn { flex:1; height:44px; border-radius:12px; border:1px solid var(--line2);
    background:rgba(255,255,255,.06); color:var(--fg2); font-size:13px;
    font-family:inherit; font-weight:500; }
  .btn.primary { background:var(--fg); border-color:var(--fg); color:#0b0b0c; font-weight:600; }
  .field { width:100%; margin:16px 0 0; height:44px; border-radius:12px;
    border:1px solid var(--line2); background:rgba(255,255,255,.05); color:var(--fg);
    font-size:13px; font-family:inherit; padding:0 13px; outline:none; }
  .field::placeholder { color:var(--fg3); }
  .field:focus { border-color:var(--accLine); }

  .flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none;
    z-index:6; transition:opacity .35s ease-out; }
  .flash.on { opacity:1; transition:none; }

  .err { position:fixed; inset:0; display:none; place-items:center; z-index:8;
    color:#ff8a8a; font-size:13px; text-align:center; padding:24px; line-height:1.7; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="scrimTop"></div>
<div class="scrimBot"></div>

<div class="hdr">
  <div class="brand"><i></i><b>PanoCam</b></div>
  <button class="ic" id="btnExit" aria-label="退出全景">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M14 5h4a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-4"/><path d="M10 12H3"/><path d="m6 9-3 3 3 3"/>
    </svg>
  </button>
</div>

<div class="bar">
  <button data-mode="0" class="active">360° 全景</button>
  <button data-mode="1">小行星</button>
  <button data-mode="2">兔子洞</button>
  <button data-mode="3">鱼眼</button>
</div>

<div class="rec" id="recHud"><i></i><span id="recTime">REC 00:00</span></div>
<div class="hud" id="hud"></div>

<div class="layer" id="spotLayer"></div>
<div class="layer" id="huntLayer"></div>

<div class="statusRow">
  <div class="fps" id="fpsHud"></div>
  <div class="hint">拖动旋转 · 双击复位</div>
</div>

<div class="dock">
  <div class="chips">
    <button class="chip" id="btnStab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 14h18"/><path d="M12 14V7"/><path d="m9 10 3-3 3 3"/></svg>
      <span>防抖</span>
    </button>
    <button class="chip" id="btnGyro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><path d="M12 5.5V12h4"/></svg>
      <span>陀螺仪</span>
    </button>
    <button class="chip" id="btnGrid">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></svg>
      <span>网格</span>
    </button>
    <button class="chip" id="btnSpot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 20s6-5.3 6-9.5A6 6 0 0 0 6 10.5C6 14.7 12 20 12 20z"/><circle cx="12" cy="10.4" r="1.8"/></svg>
      <span>热点</span>
    </button>
    <button class="chip" id="btnSeam">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 12h3M10 12h4M17 12h3"/><path d="M12 4v3M12 17v3"/></svg>
      <span>拼接缝</span>
    </button>
  </div>
  <div class="actions">
    <button class="side" id="btnShot" aria-label="拍照">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.3-1.6h6.4L16.5 7h2A1.5 1.5 0 0 1 20 8.5v8A1.5 1.5 0 0 1 18.5 18h-13A1.5 1.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
      <span>拍照</span>
    </button>
    <button class="shutter" id="btnRec" aria-label="录制"><i></i></button>
    <button class="side" id="btnQuality" aria-label="画质">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h9M18 7h2M4 17h2M9 17h11"/><circle cx="15.5" cy="7" r="2.2"/><circle cx="7.5" cy="17" r="2.2"/></svg>
      <span>画质</span>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="flash" id="flash"></div>

<div class="modal" id="spotDlg">
  <div class="card">
    <h3>添加热点</h3>
    <p>为当前视角位置命名，之后点击标记即可回到这里。</p>
    <input class="field" id="spotInput" maxlength="24" placeholder="例如 门口 / 咖啡机">
    <div class="foot">
      <button class="btn" id="spotCancel">取消</button>
      <button class="btn primary" id="spotOk">确定</button>
    </div>
  </div>
</div>

<div class="modal" id="qDlg">
  <div class="card">
    <h3>画质设置</h3>
    <p>预览决定取景流畅度，保存分辨率决定成片尺寸。</p>
    <div class="row"><span>预览分辨率</span>
      <div class="seg" id="qPrev">
        <button data-w="640">低</button><button data-w="1024">中</button><button data-w="1536">高</button>
      </div>
    </div>
    <div class="row"><span>保存分辨率</span>
      <div class="seg" id="qSave">
        <button data-w="1024">1024×512</button><button data-w="2048">2048×1024</button><button data-w="2784">2784×1392</button>
      </div>
    </div>
    <div class="foot"><button class="btn primary" id="qClose">完成</button></div>
  </div>
</div>

<div class="err" id="err"></div>

<script>
const canvas = document.getElementById('c');
const DEG = Math.PI / 180;
// App 端（Android WebView）会注入 PanoHost；网页端没有则为 null
const HOST = window.PanoHost || null;

// 画质 / 防抖设置：网页与 App 共用；App 端会把数值下发给原生拼接
// v4：画质优先——采集 3008×1504，保存上限 2784×1392（拼接光学极限）
const QUALITY_KEY = 'pano-quality-v4';
const STAB_KEY = 'pano-stab-v1';
let quality = { preview: 1536, save: 2784 };
try {
  const q = JSON.parse(localStorage.getItem(QUALITY_KEY) || 'null');
  if (q && q.preview && q.save) quality = q;
} catch (e) {}
// 防抖默认开启：预览和保存的原图都按重力 roll 锁定地平线；关掉则用相机原始朝向
let stabilize = localStorage.getItem(STAB_KEY) !== '0';

// --- 性能采样 ---------------------------------------------------------------
// App 内每 5 秒把 JS 侧 decode/upload/draw/帧间隔的 p50/p95 上报到 PanoPerf 日志
const perfBuf = { decode: [], upload: [], draw: [], raf: [] };
let frameSetAt = 0;
function perfAdd(k, v) {
  const b = perfBuf[k];
  if (!b || !Number.isFinite(v)) return;
  b.push(v);
  if (b.length > 300) b.shift();
}
function perfPct(b, p) {
  if (!b.length) return 0;
  const a = b.slice().sort((x, y) => x - y);
  return a[Math.floor((a.length - 1) * p)];
}
if (HOST && HOST.logPerf) {
  setInterval(() => {
    for (const k of ['decode', 'upload', 'draw', 'raf']) {
      const b = perfBuf[k];
      if (!b.length) continue;
      HOST.logPerf(k, perfPct(b, 0.5), perfPct(b, 0.95), b.length);
      b.length = 0;
    }
  }, 5000);
}

// ---------------------------------------------------------------------------
// 着色器：每像素反推球面方向，按投影模式采样 equirect 贴图
// ---------------------------------------------------------------------------
const VERT = `
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const FRAG = `
precision highp float;
uniform vec2 uRes;
uniform vec2 uOrigin;       // 视口在帧缓冲里的左下角，放大镜画在小窗口时必须减掉
uniform float uYaw, uPitch, uFov, uZoom;
uniform float uRoll;        // 重力水平补偿（弧度）
uniform float uGrid;          // 1 = 叠加经纬网格
uniform float uSeam;          // 1 = 用蓝色 Alpha 标出两镜头融合带
uniform int uMode;            // 0 全景 1 小行星 2 兔子洞 3 鱼眼
uniform sampler2D uTex;
const float PI = 3.141592653589793;
const float BLEND_RAD = 0.17453293;   // 10°，与拼接参数 BLEND_DEG 一致

// 与 JS 版 rotateDir 一致：先绕 X 轴 pitch，再绕 Y 轴 yaw
vec3 rotateDir(vec3 d, float yaw, float pitch) {
  float cy = cos(yaw), sy = sin(yaw);
  float cp = cos(pitch), sp = sin(pitch);
  float y1 = d.y * cp - d.z * sp;
  float z1 = d.y * sp + d.z * cp;
  return vec3(d.x * cy + z1 * sy, y1, -d.x * sy + z1 * cy);
}

// 绕视线轴旋转，用于把画面的地平线摆正
vec3 rotateRoll(vec3 d, float a) {
  float c = cos(a), s = sin(a);
  return vec3(d.x * c - d.y * s, d.x * s + d.y * c, d.z);
}

void main() {
  vec2 q = (gl_FragCoord.xy - uOrigin) / uRes;   // 视口内 0..1，原点在左下
  float u = q.x * 2.0 - 1.0;
  float vUp = q.y * 2.0 - 1.0;
  float vDn = -vUp;
  vec3 d;

  if (uMode == 1 || uMode == 2) {
    float r = length(vec2(u, vDn)) * uZoom;
    float th = 2.0 * atan(r);
    float ph = atan(vDn, u);
    d = vec3(sin(th) * cos(ph), uMode == 1 ? -cos(th) : cos(th), sin(th) * sin(ph));
    d = rotateDir(d, uYaw, 0.0);
  } else if (uMode == 3) {
    float r = length(vec2(u, vDn));
    float th = r * uFov * PI / 360.0;
    float ph = atan(vDn, u);
    d = vec3(sin(th) * cos(ph), sin(th) * sin(ph), cos(th));
    d = rotateRoll(d, uRoll);
    d = rotateDir(d, uYaw, uPitch);
  } else {
    // 按宽高比换算，竖屏手机才不会把人像纵向拉长
    float aspect = uRes.x / uRes.y;
    float tanF = tan(uFov * PI / 360.0);
    d = vec3(u * tanF * aspect, vUp * tanF, 1.0);
    d = rotateRoll(d, uRoll);
    d = rotateDir(d, uYaw, uPitch);
  }

  d = normalize(d);
  float lon = atan(d.x, d.z);
  float lat = asin(clamp(d.y, -1.0, 1.0));
  vec2 uv = vec2(lon / (2.0 * PI) + 0.5, 0.5 - lat / PI);
  vec3 col = texture2D(uTex, uv).rgb;

  if (uSeam > 0.5) {
    // 两镜头融合发生在 ray.z 落在 ±BLEND 内的区域（对应经度 ±90° 附近）
    float rz = cos(lat) * cos(lon);
    if (abs(rz) < sin(BLEND_RAD)) {
      col = mix(col, vec3(0.16, 0.55, 1.0), 0.45);
    }
  }

  if (uGrid > 0.5) {
    float lonDeg = degrees(lon);
    float latDeg = degrees(lat);
    float mLon = abs(fract(lonDeg / 15.0 + 0.5) - 0.5) * 15.0;
    float mLat = abs(fract(latDeg / 15.0 + 0.5) - 0.5) * 15.0;
    float lw = uMode >= 1 ? 0.9 : 0.35;   // 小行星/鱼眼视角尺度不同，线宽加粗
    if (mLon < lw || mLat < lw) col = mix(col, vec3(0.25, 0.9, 1.0), 0.55);
    if (abs(latDeg) < lw) col = mix(col, vec3(1.0, 0.45, 0.45), 0.6);
  }

  gl_FragColor = vec4(col, 1.0);
}
`;

// ---------------------------------------------------------------------------
// 相机状态：target 为输入目标，cur 每帧向 target 缓动
// ---------------------------------------------------------------------------
const DEFAULT = { yaw: 0, pitch: 0, fov: 100, zoom: 1 };
const target = { yaw: Math.PI, pitch: 0, fov: 100, zoom: 1 };
const cur = { ...target, roll: 0 };
let rollTarget = 0;    // 重力水平补偿（弧度），App 端推送
const SMOOTH_TAU = 0.06;
// fov 上限：透视投影超过 180° 会让 tan(fov/2) 变负、光线方向整体反向，
// 画面看起来上下左右翻个面（就是「缩放反转」）；接近 180° 时边缘也会被拉成
// 漩涡状。所以 360 全景把上限压到 130°；鱼眼是极坐标映射，不受影响，可到 220°。
const LIMIT = { fov: [20, 220], fovPano: [18, 130], zoom: [0.25, 4] };

let mode = 0;
let ready = false;
let gridOn = false;
let seamOn = false;
let spotMode = false;     // 添加热点待点击
let gyroOn = false;
const fling = { yaw: 0, pitch: 0 };

const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
if (!gl) fail('当前浏览器不支持 WebGL2，无法显示全景。');

function fail(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'grid';
}

// --- 程序与四边形 -----------------------------------------------------------
function compile(type, source) {
  const s = gl.createShader(type);
  gl.shaderSource(s, source);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    fail('着色器编译失败：' + gl.getShaderInfoLog(s));
    throw new Error(gl.getShaderInfoLog(s));
  }
  return s;
}

const prog = gl ? gl.createProgram() : null;
if (gl) {
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    fail('着色器链接失败：' + gl.getProgramInfoLog(prog));
  }
}

const uni = {};
if (gl) {
  ['uRes', 'uOrigin', 'uYaw', 'uPitch', 'uFov', 'uZoom', 'uRoll', 'uGrid', 'uSeam',
   'uMode', 'uTex'].forEach(n => {
    uni[n] = gl.getUniformLocation(prog, n);
  });
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
}

// --- 贴图 -------------------------------------------------------------------
const tex = gl ? gl.createTexture() : null;
if (gl) {
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER,
    HOST ? gl.LINEAR : gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
    new Uint8Array([0, 0, 0, 255]));
}

const img = new Image();
img.onload = () => uploadTexture(img);
img.onerror = () => { if (!HOST) fail('加载 equirect.jpg 失败，请用 pano_demo.py 启动后再访问。'); };

function uploadTexture(image) {
  if (HOST && frameSetAt) {
    perfAdd('decode', performance.now() - frameSetAt);   // dataURL -> 解码完成
    frameSetAt = 0;
  }
  const u0 = performance.now();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
  if (!HOST) gl.generateMipmap(gl.TEXTURE_2D);   // 实时帧不做 mipmap，省掉每帧开销
  const aniso = gl.getExtension('EXT_texture_filter_anisotropic');
  if (aniso) {
    const max = gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT);
    gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(max, 8));
  }
  perfAdd('upload', performance.now() - u0);
  ready = true;
  if (HOST && HOST.frameDone) HOST.frameDone();   // 通知 App 可以拼下一帧了
}

// 网页端用静态贴图；App 端改由 PanoHost 持续推送实时帧
if (!HOST) {
  img.src = 'equirect.jpg';
} else {
  document.querySelector('.hint').textContent =
    '转 90°+ 回正 = 录制 · 上仰再下俯 = 拍照';
}

// --- 数学 -------------------------------------------------------------------
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/** 按当前投影模式决定 FOV 上限：只有鱼眼能开到 180° 以上。 */
function fovLimit(m) {
  return m === 3 ? LIMIT.fov : LIMIT.fovPano;
}

function clampFov(v, m) {
  const l = fovLimit(m);
  return clamp(v, l[0], l[1]);
}

// 视空间方向 -> 世界方向（与着色器同一旋转顺序）
function rotateDir(d, yaw, pitch) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const y1 = d.y * cp - d.z * sp;
  const z1 = d.y * sp + d.z * cp;
  return { x: d.x * cy + z1 * sy, y: y1, z: -d.x * sy + z1 * cy };
}

// 世界方向 -> 视空间方向（rotateDir 的逆）
function unrotateDir(d, yaw, pitch) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const x = d.x * cy - d.z * sy;
  const z = d.x * sy + d.z * cy;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  return { x, y: d.y * cp + z * sp, z: -d.y * sp + z * cp };
}

function dirFromLonLat(lon, lat) {
  const cl = Math.cos(lat);
  return { x: cl * Math.sin(lon), y: Math.sin(lat), z: cl * Math.cos(lon) };
}

// 屏幕坐标（CSS 像素）-> 世界方向
function screenToWorld(cx, cy, cam) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const u = (cx / w) * 2 - 1;
  const vUp = 1 - (cy / h) * 2;
  const vDn = -vUp;
  let d;
  if (mode === 1 || mode === 2) return null;   // 小行星/兔子洞不做拾取
  if (mode === 3) {
    const r = Math.hypot(u, vDn);
    const th = r * cam.fov * DEG / 2;
    const ph = Math.atan2(vDn, u);
    d = { x: Math.sin(th) * Math.cos(ph), y: Math.sin(th) * Math.sin(ph), z: Math.cos(th) };
  } else {
    const tanF = Math.tan(cam.fov * DEG / 2);
    const aspect = w / Math.max(1, h);
    d = { x: u * tanF * aspect, y: vUp * tanF, z: 1 };
  }
  const n = Math.hypot(d.x, d.y, d.z);
  d = rotateDir({ x: d.x / n, y: d.y / n, z: d.z / n }, cam.yaw, cam.pitch);
  return { lon: Math.atan2(d.x, d.z), lat: Math.asin(clamp(d.y, -1, 1)) };
}

// 世界方向 -> 屏幕坐标（CSS 像素），不可见返回 null
function worldToScreen(lon, lat, cam) {
  if (mode === 1 || mode === 2) return null;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const d = unrotateDir(dirFromLonLat(lon, lat), cam.yaw, cam.pitch);
  let u, vDn;
  if (mode === 3) {
    const th = Math.acos(clamp(d.z, -1, 1));
    const r = th / (cam.fov * DEG / 2);
    if (r > 1) return null;
    const ph = Math.atan2(d.y, d.x);
    u = r * Math.cos(ph); vDn = r * Math.sin(ph);
  } else {
    if (d.z <= 0.02) return null;
    const tanF = Math.tan(cam.fov * DEG / 2);
    const aspect = w / Math.max(1, h);
    u = (d.x / d.z) / (tanF * aspect); vDn = -(d.y / d.z) / tanF;
  }
  const x = (u + 1) / 2 * w;
  const y = (1 + vDn) / 2 * h;
  if (x < -40 || x > w + 40 || y < -40 || y > h + 40) return null;   // 屏幕外不渲染标记
  return { x, y };
}

function nearestAngle(from, to) {
  let t = to;
  while (t - from > Math.PI) t -= Math.PI * 2;
  while (t - from < -Math.PI) t += Math.PI * 2;
  return t;
}

function flyTo(lon, lat) {
  target.yaw = nearestAngle(cur.yaw, lon);
  target.pitch = -lat;      // 不夹紧：竖直方向可以一直转，越过天顶/天底不会卡住
}

// --- 尺寸 / 渲染 ------------------------------------------------------------
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = Math.max(1, Math.round(canvas.clientWidth * dpr));
  let h = Math.max(1, Math.round(canvas.clientHeight * dpr));
  // 预览分辨率上限：网页端控制渲染清晰度/开销，App 端另由原生拼接尺寸决定
  if (w > quality.preview) {
    const k = quality.preview / w;
    w = quality.preview;
    h = Math.max(1, Math.round(h * k));
  }
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  return dpr;
}
window.addEventListener('resize', resize);
resize();

function drawScene(w, h, cam, opts) {
  opts = opts || {};
  const ox = opts.origin ? opts.origin[0] : 0;
  const oy = opts.origin ? opts.origin[1] : 0;
  gl.viewport(ox, oy, w, h);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(prog);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform2f(uni.uRes, w, h);
  gl.uniform2f(uni.uOrigin, ox, oy);
  gl.uniform1f(uni.uYaw, cam.yaw);
  gl.uniform1f(uni.uPitch, cam.pitch);
  gl.uniform1f(uni.uFov, opts.fov != null ? opts.fov : cam.fov);
  gl.uniform1f(uni.uZoom, cam.zoom);
  gl.uniform1f(uni.uRoll, cam.roll || 0);
  gl.uniform1f(uni.uGrid, opts.grid != null ? opts.grid : (gridOn ? 1 : 0));
  gl.uniform1f(uni.uSeam, seamOn ? 1 : 0);
  gl.uniform1i(uni.uMode, mode);
  gl.uniform1i(uni.uTex, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function draw() {
  resize();
  drawScene(canvas.width, canvas.height, cur);
}

// --- 覆盖层更新 -------------------------------------------------------------
const spotLayer = document.getElementById('spotLayer');
const huntLayer = document.getElementById('huntLayer');

let spots = [];
try { spots = JSON.parse(localStorage.getItem('pano_spots_v1') || '[]'); } catch (e) { spots = []; }

}

// --- 寻宝游戏 ---------------------------------------------------------------
let huntOn = false;
let huntTargets = [];
let huntTimer = 0, huntStart = 0, huntElapsed = 0;
const HUNT_KEY = 'pano_hunt_best';
const HUNT_COUNT = 3;

function huntBest() {
  return Number(localStorage.getItem(HUNT_KEY) || 0);
}

function startHunt() {
  huntTargets.forEach(t => t.el && t.el.remove());
  huntTargets = [];
  for (let i = 0; i < HUNT_COUNT; i++) {
    const lon = (Math.random() * 2 - 1) * Math.PI;
    const lat = (Math.random() * 2 - 1) * 60 * DEG;
    const el = document.createElement('div');
    el.className = 'target hide';
    huntLayer.appendChild(el);
    huntTargets.push({ lon, lat, found: false, el });
  }
  huntOn = true;
  huntStart = performance.now();
  huntElapsed = 0;
  hud.classList.add('on');
  huntTimer = 0;
  toast('寻宝开始：转动视角，点掉 3 个绿色星标');
}

function stopHunt() {
  huntOn = false;
  huntTargets.forEach(t => t.el && t.el.remove());
  huntTargets = [];
  hud.classList.remove('on');
}

function updateHud() {
  if (!huntOn) return;
  const s = huntElapsed / 1000;
  const left = huntTargets.filter(t => !t.found).length;
  hud.innerHTML = '寻宝中 · 用时 ' + s.toFixed(1) + 's<br>剩余 ' + left + ' / ' + HUNT_COUNT +
    ' · 最佳 ' + (huntBest() ? huntBest().toFixed(1) + 's' : '—');
}

function checkHuntClick(x, y) {
  for (const t of huntTargets) {
    if (t.found) continue;
    const p = worldToScreen(t.lon, t.lat, cur);
    if (!p) continue;
    if (Math.hypot(p.x - x, p.y - y) < 32) {
      t.found = true;
      t.el.classList.add('hide');
      flyTo(t.lon, t.lat);
      if (huntTargets.every(v => v.found)) {
        stopHunt();
        if (!huntBest() || huntElapsed / 1000 < huntBest()) {
          localStorage.setItem(HUNT_KEY, String(huntElapsed / 1000));
          toast('全部找到！用时 ' + (huntElapsed / 1000).toFixed(1) + 's，刷新最佳记录');
        } else {
          toast('全部找到！用时 ' + (huntElapsed / 1000).toFixed(1) + 's');
        }
      }
      return true;
    }
  }
  return false;
}

// --- 交互 -------------------------------------------------------------------
let dragging = false, lx = 0, ly = 0;
let downX = 0, downY = 0, downT = 0, moved = 0;
let vYaw = 0, vPitch = 0;

// 双指缩放（手机端没有滚轮）
const pointers = new Map();
let pinchDist = 0;

function pairDist() {
  const p = Array.from(pointers.values());
  return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
}

canvas.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size >= 2) {
    pinchDist = pairDist();
    dragging = false;
    canvas.classList.remove('dragging');
    return;
  }
  dragging = true; lx = e.clientX; ly = e.clientY;
  downX = e.clientX; downY = e.clientY; downT = performance.now();
  moved = 0; vYaw = 0; vPitch = 0;
  fling.yaw = 0; fling.pitch = 0;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size >= 2) {
    const d = pairDist();
    if (pinchDist > 0 && d > 0) {
      const k = pinchDist / d;
      if (mode === 1 || mode === 2) {
        target.zoom = clamp(target.zoom * k, LIMIT.zoom[0], LIMIT.zoom[1]);
      } else {
        target.fov = clampFov(target.fov * k, mode);
      }
    }
    pinchDist = d;
    return;
  }

  const rect = canvas.getBoundingClientRect();
  if (!dragging) return;
  const dx = (e.clientX - lx) / canvas.clientWidth;
  const dy = (e.clientY - ly) / canvas.clientHeight;
  lx = e.clientX; ly = e.clientY;
  moved += Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY);
  if (mode === 1 || mode === 2) {
    target.yaw += dx * 2.5;
    vYaw = dx * 2.5 * 60;      // 约按 60Hz 采样估算角速度
  } else {
    // 拖拽比例按当前视场角换算，透视模式还要考虑宽高比（竖屏时横向角跨度更大）
    const aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);
    const vSpan = cur.fov * DEG;
    const hSpan = (mode === 3) ? vSpan
      : 2 * Math.atan(Math.tan(cur.fov * DEG / 2) * aspect);
    // 画面会被 roll（地平线补偿）整体旋转，拖动增量必须按同一个角度转过去，
    // 否则竖向拖动会变成横向旋转、横向拖动会变成竖向旋转
    const cr = Math.cos(cur.roll), sr = Math.sin(cur.roll);
    const dYaw = (dx * hSpan) * cr + (dy * vSpan) * sr;
    const dPitch = -(dx * hSpan) * sr + (dy * vSpan) * cr;
    // 拖动方向 = 视角转动方向（左右、上下都不再反向）
    target.yaw += dYaw;
    target.pitch += dPitch;   // 不夹紧，竖直方向可连续转 360°
    vYaw = dYaw * 60;
    vPitch = dPitch * 60;
  }
});

function endDrag(e) {
  pointers.delete(e.pointerId);
  pinchDist = 0;
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove('dragging');
  const dt = performance.now() - downT;
  const isClick = moved < 8 && dt < 500 && pointers.size === 0;
  if (isClick) {
    handleClick(e.clientX, e.clientY);
  } else if (!isClick) {
    fling.yaw = clamp(vYaw, -30, 30);
    fling.pitch = clamp(vPitch, -20, 20);
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', e => {
  pointers.delete(e.pointerId);
  pinchDist = 0;
  dragging = false;
  canvas.classList.remove('dragging');
});

function handleClick(sx, sy) {
  const rect = canvas.getBoundingClientRect();
  const x = sx - rect.left, y = sy - rect.top;

  if (huntOn && checkHuntClick(x, y)) return;

  const w = screenToWorld(x, y, cur);
  if (!w) return;

  if (spotMode) openSpotDialog(w);
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (mode === 1 || mode === 2) {
    target.zoom = clamp(target.zoom * (1 + e.deltaY * 0.001), LIMIT.zoom[0], LIMIT.zoom[1]);
  } else {
    target.fov = clampFov(target.fov + e.deltaY * 0.08, mode);
  }
}, { passive: false });

canvas.addEventListener('dblclick', () => {
  target.yaw = DEFAULT.yaw;
  target.pitch = DEFAULT.pitch;
  target.fov = DEFAULT.fov;
  target.zoom = DEFAULT.zoom;
});

document.querySelectorAll('.bar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.bar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = Number(btn.dataset.mode);
    // 从鱼眼切回透视投影时把超限的 fov 收回来，避免直接进到「翻转」区间
    target.fov = clampFov(target.fov, mode);
  });
});

// --- 陀螺仪 -----------------------------------------------------------------
function onOrientation(e) {
  if (!gyroOn || dragging) return;
  if (e.alpha == null || e.beta == null) return;
  target.yaw = -e.alpha * DEG;
  target.pitch = (e.beta - 90) * DEG;
}

function toggleGyro() {
  const btn = document.getElementById('btnGyro');
  if (HOST) {
    gyroOn = !gyroOn;
    HOST.setGyro(gyroOn);
    btn.classList.toggle('on', gyroOn);
    toast(gyroOn ? '手机陀螺仪已开启，转动手机看四周' : '手机陀螺仪已关闭');
    return;
  }
  if (gyroOn) {
    gyroOn = false;
    window.removeEventListener('deviceorientation', onOrientation);
    btn.classList.remove('on');
    toast('陀螺仪已关闭');
    return;
  }
  if (typeof DeviceOrientationEvent === 'undefined') { toast('当前设备不支持陀螺仪'); return; }
  const enable = () => {
    gyroOn = true;
    window.addEventListener('deviceorientation', onOrientation);
    btn.classList.add('on');
    toast('陀螺仪已开启，转动手机即可看四周');
  };
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(r => {
      if (r === 'granted') enable();
      else toast('陀螺仪权限被拒绝');
    }).catch(() => toast('陀螺仪权限申请失败'));
  } else {
    enable();
  }
}

// --- 工具栏 -----------------------------------------------------------------
const btnGrid = document.getElementById('btnGrid');
const btnSpot = document.getElementById('btnSpot');
const btnExit = document.getElementById('btnExit');

document.getElementById('btnGyro').addEventListener('click', toggleGyro);

btnGrid.addEventListener('click', () => {
  gridOn = !gridOn;
  btnGrid.classList.toggle('on', gridOn);
});

const btnSeam = document.getElementById('btnSeam');
btnSeam.addEventListener('click', () => {
  seamOn = !seamOn;
  btnSeam.classList.toggle('on', seamOn);
  toast(seamOn ? '蓝色区域即两镜头融合带（±10°）' : '已关闭拼接缝标记');
});

btnSpot.addEventListener('click', () => {
  if (mode === 1 || mode === 2) { toast('小行星/兔子洞模式下无法添加热点'); return; }
  spotMode = !spotMode;
  btnSpot.classList.toggle('on', spotMode);
  if (spotMode) toast('点击画面任意位置添加热点');
});

// 右侧栏「退出全景」：App 内通知原生关闭，网页端隐藏
btnExit.addEventListener('click', () => {
  if (HOST && HOST.exit) {
    HOST.exit();
  } else {
    toast('网页端没有可退出的全景页');
  }
});
if (!HOST) btnExit.style.display = 'none';

// --- 海报导出 ---------------------------------------------------------------
async function exportPoster() {
  if (!ready) { toast('贴图尚未就绪'); return; }
  const W = 1920, H = 1080;
  const oldW = canvas.width, oldH = canvas.height;
  canvas.width = W; canvas.height = H;
  drawScene(W, H, cur, { grid: gridOn ? 1 : 0 });

  const shot = document.createElement('canvas');
  shot.width = W; shot.height = H;
  const g = shot.getContext('2d');
  g.drawImage(canvas, 0, 0, W, H);

  // 水印
  const label = ['360° 全景', '小行星', '兔子洞', '鱼眼'][mode] || '';
  g.font = '700 56px "Microsoft YaHei", sans-serif';
  g.fillStyle = 'rgba(255,255,255,.92)';
  g.fillText('全景相机 · ' + label, 64, H - 64);
  g.font = '400 26px "Microsoft YaHei", sans-serif';
  g.fillStyle = 'rgba(255,255,255,.6)';
  g.fillText('全景相机 · ' + new Date().toLocaleDateString(),
    64, H - 24);

  canvas.width = oldW; canvas.height = oldH;
  resize();

  if (HOST) {
    HOST.savePoster(shot.toDataURL('image/png'));
    toast('海报已保存到手机');
    return;
  }

  shot.toBlob(b => {
    if (!b) { toast('海报生成失败'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pano-poster-' + Date.now() + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('海报已导出（1920×1080）');
  }, 'image/png');
}

// --- 录制 / 拍照 -------------------------------------------------------------
const recHud = document.getElementById('recHud');
const recTimeEl = document.getElementById('recTime');
const btnRec = document.getElementById('btnRec');
const btnShot = document.getElementById('btnShot');
let recOn = false;
let recStartAt = 0;
let webRecorder = null;
let recChunks = [];

function setRecUi(on) {
  recOn = on;
  btnRec.classList.toggle('on', on);
  recHud.classList.toggle('on', on);
  if (on) {
    recStartAt = performance.now();
    recTimeEl.textContent = 'REC 00:00';
  }
}

function updateRecUi() {
  if (!recOn) return;
  const s = Math.max(0, (performance.now() - recStartAt) / 1000);
  const mm = String(Math.floor(s / 60)).padStart(2, '0');
  const ss = String(Math.floor(s % 60)).padStart(2, '0');
  recTimeEl.textContent = 'REC ' + mm + ':' + ss;
}

// App 端录制交给原生编码拼接后的 2:1 原图；这里只发请求，状态由 panoOnEvent 回推
function toggleRecord() {
  if (HOST && HOST.toggleRecord) {
    HOST.toggleRecord();
    return;
  }
  if (recOn) {
    stopWebRecord();
  } else {
    startWebRecord();
  }
}

function pickRecMime() {
  const list = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  for (const m of list) {
    if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(m)) return m;
  }
  return '';
}

// 网页端录制的是拼接后的 2:1 等距原图（不是当前视角截图）
let eqCanvas = null, eqCtx = null, eqTimer = 0;

function drawEquirectFrame() {
  if (!img.naturalWidth || !img.naturalHeight) return false;
  const w = quality.save, h = Math.round(quality.save / 2);
  if (!eqCanvas) {
    eqCanvas = document.createElement('canvas');
    eqCtx = eqCanvas.getContext('2d');
  }
  if (eqCanvas.width !== w || eqCanvas.height !== h) {
    eqCanvas.width = w; eqCanvas.height = h;
  }
  eqCtx.drawImage(img, 0, 0, w, h);
  return true;
}

function startWebRecord() {
  if (!drawEquirectFrame() || !eqCanvas.captureStream) {
    toast('当前浏览器不支持录制全景原图');
    return;
  }
  let stream, mime = pickRecMime();
  try {
    stream = eqCanvas.captureStream(30);
    webRecorder = new MediaRecorder(stream,
      mime ? { mimeType: mime, videoBitsPerSecond: 6000000 } : undefined);
  } catch (e) {
    toast('录制初始化失败：' + e);
    webRecorder = null;
    return;
  }
  recChunks = [];
  webRecorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  webRecorder.onstop = () => {
    const type = recChunks.length ? recChunks[0].type : 'video/webm';
    const blob = new Blob(recChunks, { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pano-' + new Date().toISOString().replace(/[:.]/g, '-') + '.webm';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast('全景视频已导出（' + (blob.size / 1048576).toFixed(1) + ' MB）');
  };
  // 静态图也要持续出帧，否则画面只有一帧
  eqTimer = setInterval(() => drawEquirectFrame(), 33);
  webRecorder.start(1000);
  setRecUi(true);
  toast('开始录屏（拼接原图 2:1）');
}

function stopWebRecord() {
  if (eqTimer) { clearInterval(eqTimer); eqTimer = 0; }
  if (webRecorder && webRecorder.state !== 'inactive') webRecorder.stop();
  webRecorder = null;
  setRecUi(false);
}

function shutterFlash() {
  const f = document.getElementById('flash');
  f.classList.add('on');
  setTimeout(() => f.classList.remove('on'), 40);
}

// 保存拼接后的 2:1 等距原图（网页下载，App 交给原生存相册）
function takePhoto() {
  if (HOST && HOST.capturePhoto) {
    HOST.capturePhoto();
    return;
  }
  if (!img.complete || !img.naturalWidth) { toast('画面尚未就绪'); return; }
  const w = quality.save, h = Math.round(quality.save / 2);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  shutterFlash();
  c.toBlob(b => {
    if (!b) { toast('拍照失败'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pano-equirect-' + Date.now() + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast('已导出 2:1 拼接原图');
  }, 'image/png');
}

// App 端手势/录制状态由原生主动推过来
window.panoOnEvent = function (name, msg) {
  if (name === 'rec-start') {
    setRecUi(true);
    toast('开始录制全景原图');
  } else if (name === 'rec-stop') {
    setRecUi(false);
    if (msg) toast(msg);
  } else if (name === 'shutter') {
    shutterFlash();          // 原图由原生保存，这里只给快门反馈
  } else if (name === 'fps' && msg) {
    const el = document.getElementById('fpsHud');
    el.textContent = msg;    // 例：18.2 fps · 54 ms
    el.classList.add('on');
  } else if (name === 'toast' && msg) {
    toast(msg);
  }
};

btnRec.addEventListener('click', toggleRecord);
btnShot.addEventListener('click', takePhoto);

// --- 画质 / 防抖 -------------------------------------------------------------
const btnStab = document.getElementById('btnStab');
const btnQuality = document.getElementById('btnQuality');
const qDlg = document.getElementById('qDlg');

function applyQuality(prevW, saveW) {
  if (prevW) quality.preview = prevW;
  if (saveW) quality.save = saveW;
  localStorage.setItem(QUALITY_KEY, JSON.stringify(quality));
  document.querySelectorAll('#qPrev button').forEach(b =>
    b.classList.toggle('on', Number(b.dataset.w) === quality.preview));
  document.querySelectorAll('#qSave button').forEach(b =>
    b.classList.toggle('on', Number(b.dataset.w) === quality.save));
  if (HOST && HOST.setQuality) HOST.setQuality(quality.preview, quality.save);
}

btnQuality.addEventListener('click', () => qDlg.classList.toggle('on'));
document.getElementById('qClose').addEventListener('click', () => qDlg.classList.remove('on'));
document.querySelectorAll('#qPrev button').forEach(b =>
  b.addEventListener('click', () => applyQuality(Number(b.dataset.w), 0)));
document.querySelectorAll('#qSave button').forEach(b =>
  b.addEventListener('click', () => applyQuality(0, Number(b.dataset.w))));

function setStabilize(on, quiet) {
  stabilize = on;
  btnStab.classList.toggle('on', on);
  localStorage.setItem(STAB_KEY, on ? '1' : '0');
  if (HOST && HOST.setStabilize) HOST.setStabilize(on);
  if (!quiet) {
    toast(on ? (HOST ? '防抖开启：录制/拍照会锁定地平线'
                      : '网页端不支持防抖，App 内生效')
             : '防抖关闭');
  }
}

btnStab.addEventListener('click', () => setStabilize(!stabilize, false));
applyQuality(0, 0);
setStabilize(stabilize, true);

// --- 深链接 ----------------------------------------------------------------
(function applyDeepLink() {
  const p = new URLSearchParams(location.search);
  const num = (k, d) => {
    const raw = p.get(k);
    if (raw == null || raw === '') return d;
    const v = Number(raw);
    return Number.isFinite(v) ? v : d;
  };
  if (p.has('mode')) {
    mode = clamp(Math.round(num('mode', 0)), 0, 3);
    document.querySelectorAll('.bar button').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.mode) === mode);
    });
  }
  target.yaw = cur.yaw = num('yaw', target.yaw);
  target.pitch = cur.pitch = num('pitch', target.pitch);
  target.fov = cur.fov = clampFov(num('fov', target.fov), mode);
  target.zoom = cur.zoom = clamp(num('zoom', target.zoom), LIMIT.zoom[0], LIMIT.zoom[1]);
})();

// --- App 宿主轮询（WebView 内只有这一处与网页端不同） ------------------------
let lastHostPoll = 0;

function pollHost(now) {
  // 8ms 节流：rAF 每次（~11ms）都能取到最新帧；之前 55ms 把预览帧率卡在 ~9fps
  if (!HOST || now - lastHostPoll < 8) return;
  lastHostPoll = now;

  const frame = HOST.pollFrame();
  if (frame && frame.length) {
    frameSetAt = performance.now();
    img.src = frame;      // img.onload 统一走 uploadTexture
  }

  const g = HOST.pollGyro();
  if (g && g.length) {
    const parts = g.split(',');
    const dy = Number(parts[0]);
    const dp = Number(parts[1]);
    const rl = Number(parts[2]);
    if (!dragging && Number.isFinite(dy) && Number.isFinite(dp)) {
      // 陀螺仪增量来自界面坐标系，同样要跟着 roll 一起转
      const cr = Math.cos(cur.roll), sr = Math.sin(cur.roll);
      target.yaw += (dy * cr + dp * sr) * DEG;
      target.pitch += (-dy * sr + dp * cr) * DEG;
    }
    if (Number.isFinite(rl)) rollTarget = rl * DEG;   // 重力水平补偿
  }
}

// --- 主循环 -----------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const rafDt = now - last;
  const dt = Math.min(rafDt / 1000, 0.1);
  last = now;
  if (HOST) perfAdd('raf', rafDt);

  pollHost(now);

  // 惯性滑行
  if (!dragging && (Math.abs(fling.yaw) > 0.01 || Math.abs(fling.pitch) > 0.01)) {
    target.yaw += fling.yaw * dt;
    if (mode === 0 || mode === 3) {
      target.pitch += fling.pitch * dt;
    }
    const decay = Math.exp(-dt * 3.2);
    fling.yaw *= decay; fling.pitch *= decay;
  }

  const k = 1 - Math.exp(-dt / SMOOTH_TAU);
  cur.yaw += (target.yaw - cur.yaw) * k;
  cur.pitch += (target.pitch - cur.pitch) * k;
  cur.fov += (target.fov - cur.fov) * k;
  cur.zoom += (target.zoom - cur.zoom) * k;
  cur.roll += (rollTarget - cur.roll) * k;

  if (huntOn) { huntElapsed = performance.now() - huntStart; updateHud(); }
  updateRecUi();
  updateOverlays();
  if (ready) {
    const d0 = performance.now();
    draw();
    if (HOST) perfAdd('draw', performance.now() - d0);   // WebGL 提交耗时（CPU 侧）
  }
  requestAnimationFrame(frame);
}

renderSpots();
requestAnimationFrame(frame);
</script>
