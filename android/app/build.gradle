plugins { id 'com.android.application' }

android {
    namespace 'com.example.panocam'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.panocam"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "1.7"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.github.jiangdongguo.AndroidUSBCamera:libuvc:3.2.7'
    implementation('com.github.jiangdongguo.AndroidUSBCamera:libausbc:3.2.7') {
        exclude group: 'com.gyf.immersionbar', module: 'immersionbar'
        exclude group: 'com.zlc.glide', module: 'webpdecoder'
    }
}
